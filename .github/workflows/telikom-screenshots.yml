name: Telikom Full Page Screenshots

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/telikom-screenshots.yml'

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install chromium
      - name: Capture screenshots
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/telikom-server.log 2>&1 &
          mkdir -p screenshots
          cat > capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1});
          const page=await context.newPage();
          page.setDefaultTimeout(20000);
          for(let i=1;i<=6;i++){
            await page.goto(`http://127.0.0.1:8080/telikom-homepage-mocks/${i}.html`,{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(3500);
            await page.evaluate(()=>{
              document.querySelectorAll('.reveal').forEach(el=>{el.classList.add('is-visible','in');el.style.opacity='1';el.style.transform='none'});
              document.querySelectorAll('[loading="lazy"]').forEach(el=>el.removeAttribute('loading'));
              window.scrollTo(0,0);
            });
            await page.waitForTimeout(700);
            await page.screenshot({path:`screenshots/telikom-design-${i}-full.png`,fullPage:true,animations:'disabled',timeout:20000});
          }
          await browser.close();
          EOF
          node capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: telikom-full-page-screenshots
          path: screenshots/
          retention-days: 14
