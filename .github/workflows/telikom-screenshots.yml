name: Telikom Full Page Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install chromium
      - name: Capture screenshots
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/telikom-server.log 2>&1 &
          mkdir -p screenshots
          cat > capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1});
          const page=await context.newPage();
          for(let i=1;i<=6;i++){
            await page.goto(`http://127.0.0.1:8080/telikom-homepage-mocks/${i}.html`,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(2500);
            await page.evaluate(async()=>{for(let y=0;y<document.documentElement.scrollHeight;y+=800){window.scrollTo(0,y);await new Promise(r=>setTimeout(r,60))}window.scrollTo(0,0);await new Promise(r=>setTimeout(r,300))});
            await page.screenshot({path:`screenshots/telikom-design-${i}-full.png`,fullPage:true,animations:'disabled'});
          }
          await browser.close();
          EOF
          node capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: telikom-full-page-screenshots
          path: screenshots/
          retention-days: 14
